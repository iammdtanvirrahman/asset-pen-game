<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

const root=document.querySelector('#view'),status=document.querySelector('#status'),dot=document.querySelector('#dot'),err=document.querySelector('#error');
const scene=new THREE.Scene(); scene.background=new THREE.Color('#171719');
scene.fog=new THREE.Fog('#171719',12,30);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,100);
camera.position.set(5.4,5.0,7.4);
const renderer=new THREE.WebGLRenderer({antialias:innerWidth>700,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=3;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.49;controls.autoRotate=true;controls.autoRotateSpeed=.55;
scene.add(new THREE.HemisphereLight(0xe1e9ff,0x493022,2.0));
const key=new THREE.DirectionalLight(0xffedda,3.2);key.position.set(4,8,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;scene.add(key);
const fill=new THREE.DirectionalLight(0xa7c8ff,1.25);fill.position.set(-5,4,-3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#252326',roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-.18;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader();let table=null,penTemplate=null,penCount=0,tableTopY=1.11,tableSurfaceAdded=false;const MAX_PENS=2;const pens=[];const group=new THREE.Group();scene.add(group);
const physicsWorld=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
physicsWorld.allowSleep=true;physicsWorld.broadphase=new CANNON.SAPBroadphase(physicsWorld);physicsWorld.solver.iterations=16;
const tablePhysicsMaterial=new CANNON.Material('table'),penPhysicsMaterial=new CANNON.Material('pen'),floorPhysicsMaterial=new CANNON.Material('floor');
physicsWorld.addContactMaterial(new CANNON.ContactMaterial(tablePhysicsMaterial,penPhysicsMaterial,{friction:.86,restitution:.06}));
physicsWorld.addContactMaterial(new CANNON.ContactMaterial(penPhysicsMaterial,penPhysicsMaterial,{friction:.48,restitution:.2}));
physicsWorld.addContactMaterial(new CANNON.ContactMaterial(floorPhysicsMaterial,penPhysicsMaterial,{friction:.72,restitution:.08}));
const physicsBodies=[];
let TABLE_HALF_X=2.86,TABLE_HALF_Z=1.75,physicsSurfaceY=1.116;
let matchOver=false;
function setupPhysicsSurface(topY,halfX=2.86,halfZ=1.75){
 if(tableSurfaceAdded)return;
 // Invisible collision deck: top is fractionally above the rendered wood to prevent visible interpenetration.
 TABLE_HALF_X=Math.max(.5,halfX-.012);TABLE_HALF_Z=Math.max(.5,halfZ-.012);
 physicsSurfaceY=topY+.006;
 const surfaceThickness=.16;
 const tabletop=new CANNON.Body({mass:0,material:tablePhysicsMaterial,shape:new CANNON.Box(new CANNON.Vec3(TABLE_HALF_X,surfaceThickness/2,TABLE_HALF_Z))});
 tabletop.position.set(0,physicsSurfaceY-surfaceThickness/2,0);
 tabletop.collisionFilterGroup=1;tabletop.collisionFilterMask=1;
 physicsWorld.addBody(tabletop);
 const floorBody=new CANNON.Body({mass:0,material:floorPhysicsMaterial,shape:new CANNON.Plane()});
 floorBody.position.set(0,-.18,0);floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);physicsWorld.addBody(floorBody);

}
function createPenBody(mesh,index){
 // Keep visual GLB and collider dimensions in the same normalized scale.
 const mass=index===0?.03:.05;
 mesh.updateWorldMatrix(true,true);
 const worldBounds=new THREE.Box3().setFromObject(mesh);
 const size=worldBounds.getSize(new THREE.Vector3());
 const center=worldBounds.getCenter(new THREE.Vector3());
 const length=Math.max(.18,size.x,size.z);
 const radius=Math.max(.009,Math.min(.024,Math.min(size.y,size.z)*.42));
 const longAxis=size.x>=size.z?'x':'z';
 const body=new CANNON.Body({mass,material:penPhysicsMaterial});
 body.addShape(new CANNON.Cylinder(radius,radius,length,16));
 // Cannon cylinder local Y axis is the pen's long axis; orient it to the model's actual long axis.
 const axisRotation=new CANNON.Quaternion();
 axisRotation.setFromEuler(0,0,longAxis==='x'?Math.PI/2:0);
 if(longAxis==='z')axisRotation.setFromEuler(Math.PI/2,0,0);
 body.addShape(new CANNON.Cylinder(radius,radius,length,16),new CANNON.Vec3(0,0,0),axisRotation);
 body.position.set(center.x,center.y,center.z);
 body.quaternion.set(mesh.quaternion.x,mesh.quaternion.y,mesh.quaternion.z,mesh.quaternion.w);

}
const hitMarkers=[];
const hitMarkerGeometry=new THREE.SphereGeometry(.018,12,8);
const hitRingGeometry=new THREE.TorusGeometry(.038,.006,6,20);
function showHitMarker(pen,worldPoint,worldNormal){
 pen.updateWorldMatrix(true,true);
 const marker=new THREE.Group();
 const dotMaterial=new THREE.MeshBasicMaterial({color:0xff7043,transparent:true,opacity:1,depthTest:false,toneMapped:false});
 const ringMaterial=new THREE.MeshBasicMaterial({color:0xffc08a,transparent:true,opacity:1,depthTest:false,toneMapped:false});
 marker.userData.isHitMarker=true;
 const dot=new THREE.Mesh(hitMarkerGeometry,dotMaterial);dot.renderOrder=20;dot.userData.isHitMarker=true;marker.add(dot);
 const ring=new THREE.Mesh(hitRingGeometry,ringMaterial);ring.renderOrder=20;ring.userData.isHitMarker=true;marker.add(ring);
 const localPoint=pen.worldToLocal(worldPoint.clone());
 const localNormalPoint=pen.worldToLocal(worldPoint.clone().add(worldNormal));
 const localNormal=localNormalPoint.sub(localPoint).normalize();
 marker.position.copy(localPoint).addScaledVector(localNormal,.012);
 marker.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),localNormal);
 marker.renderOrder=20;pen.add(marker);
 hitMarkers.push({marker,dotMaterial,ringMaterial,born:performance.now()/1000,duration:1.25});

}
function startPenHit(pointerEvent){
 const rect=renderer.domElement.getBoundingClientRect();
 const ndc=new THREE.Vector2(((pointerEvent.clientX-rect.left)/rect.width)*2-1,-((pointerEvent.clientY-rect.top)/rect.height)*2+1);
 const raycaster=new THREE.Raycaster();raycaster.setFromCamera(ndc,camera);
 const hits=raycaster.intersectObjects(pens,true);
 const hit=hits.find(candidate=>{
  let object=candidate.object;
  while(object){if(object.userData?.isHitMarker)return false;object=object.parent;}
  return true;
 });
 if(!hit||matchOver)return;
 let pen=hit.object;while(pen&&!pens.includes(pen))pen=pen.parent;if(!pen)return;

 let worldNormal=hit.face?.normal?.clone()??new THREE.Vector3(0,1,0);
 worldNormal.transformDirection(hit.object.matrixWorld).normalize();
 const localPoint=showHitMarker(pen,hit.point,worldNormal);
 const localBox=new THREE.Box3().setFromObject(pen);
 const localBounds=new THREE.Box3().setFromObject(pen);

}
let activeHit=null;
let aimVectorHelper=null,vectorHideAt=0;
const vectorInfo=document.querySelector('#vectorInfo');
const MAX_DRAG=150,MIN_DRAG=18;
function getStrikeDirection(dx,dy,dist,item){
 // A screen-space pull is converted to a world-space pull-back vector on the table plane.
 camera.updateMatrixWorld();
 const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);right.y=0;right.normalize();
 const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();
 const dir=right.clone().multiplyScalar(-dx).addScaledVector(forward,dy);

 if(dir.lengthSq()<1e-8)dir.set(1,0,0);

}
function getStrikePower(dist){return Math.min(1,Math.max(0,dist)/MAX_DRAG);}
function getStrikeStrength(dist){

 // Nonlinear build-up similar to the original game's flick-power curve.

}
function setHitVector(origin,dir,dist,active=false){
 const power=getStrikePower(dist),strength=getStrikeStrength(dist);

 const length=.32+power*1.45;
 if(!aimVectorHelper){
  aimVectorHelper=new THREE.ArrowHelper(dir,origin,length,color,.13,.075);
  scene.add(aimVectorHelper);
 }else{
  aimVectorHelper.visible=true;aimVectorHelper.position.copy(origin);aimVectorHelper.setDirection(dir);aimVectorHelper.setLength(length,.13,.075);aimVectorHelper.setColor(color);
 }
 vectorHideAt=performance.now()/1000+(active?60:1.7);
 const arrow=dir.x<-.3?'←':dir.x>.3?'→':dir.z<-.3?'↑':dir.z>.3?'↓':'↗';

}
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('pointerdown',event=>{
 if(event.button!==undefined&&event.button!==0)return;
 const hit=startPenHit(event);if(!hit)return;
 activeHit=hit;controls.enabled=false;event.preventDefault();

 try{renderer.domElement.setPointerCapture(event.pointerId)}catch{}
});
renderer.domElement.addEventListener('pointermove',event=>{
 if(!activeHit)return;

 if(dist<MIN_DRAG){vectorInfo.textContent='PULL BACK · '+Math.round(getStrikePower(dist)*100)+'% · drag farther to strike';if(aimVectorHelper)aimVectorHelper.visible=false;return;}

 setHitVector(new THREE.Vector3(point.x,point.y+.055,point.z),dir,dist,true);
});
function finishPenHit(event){
 if(!activeHit)return;
 const selected=activeHit;activeHit=null;controls.enabled=true;
 const dx=event.clientX-selected.x,dy=event.clientY-selected.y,dist=Math.hypot(dx,dy);
 if(dist<MIN_DRAG){
  if(aimVectorHelper)aimVectorHelper.visible=false;
  vectorInfo.textContent='HIT VECTOR · pull back at least '+MIN_DRAG+' px to strike';
  setStatus('Pull back from the selected pen point to build power');
  return;
 }
 selected.item.mesh.updateWorldMatrix(true,false);
 const impactPoint=selected.item.mesh.localToWorld(selected.localPoint.clone());
 const dir=getStrikeDirection(dx,dy,dist,selected.item);
 const strength=getStrikeStrength(dist);
 setHitVector(new THREE.Vector3(impactPoint.x,impactPoint.y+.055,impactPoint.z),dir,dist,false);
 const body=selected.item.body;
 body.wakeUp();
 // Cannon expects the impact point as an offset from the body's center.
 const relativePoint=new CANNON.Vec3(
  impactPoint.x-body.position.x,
  impactPoint.y-body.position.y,
  impactPoint.z-body.position.z
 );
 // The pen's asymmetric body can roll/twist; impact offset creates angular impulse via r × J.
 // Strike direction stays on the tabletop plane; don't inject artificial upward lift.
 const power=getStrikePower(dist);
 const impulse=new CANNON.Vec3(dir.x*strength,0,dir.z*strength);
 body.applyImpulse(impulse,relativePoint);
 // Realistic hit response also depends on where the force is applied, not just its direction.
 body.wakeUp();

renderer.domElement.addEventListener('pointerup',finishPenHit);
renderer.domElement.addEventListener('pointercancel',()=>{activeHit=null;controls.enabled=true});
function frameTableSurface(){const focusY=tableTopY*.74;controls.target.set(0,focusY,0);camera.position.set(5.4,focusY+4.1,7.4);controls.update();}
const tableUrl='./assets/table/models/gallinera_table_4k.glb';
const penUrl='./assets/pens/models/faber-castell_pen.glb';
function setStatus(s,ok=false){status.textContent=s;dot.classList.toggle('ok',ok)}
function fitObject(obj,targetSize=1){const b=new THREE.Box3().setFromObject(obj),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());obj.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;obj.scale.multiplyScalar(targetSize/max);return new THREE.Box3().setFromObject(obj)}
function makeFallbackTable(){
 const g=new THREE.Group();const wood=new THREE.MeshStandardMaterial({color:'#8c5635',roughness:.78});
 const top=new THREE.Mesh(new THREE.BoxGeometry(5.6,.22,3.5),wood);top.position.y=1;top.castShadow=true;top.receiveShadow=true;g.add(top);
 const legsMat=new THREE.MeshStandardMaterial({color:'#514039',roughness:.82});
 for(const x of [-2.45,2.45])for(const z of [-1.45,1.45]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.16,1,.16),legsMat);leg.position.set(x,.48,z);leg.castShadow=true;g.add(leg)}return g;
}
function normalizeTable(obj){

 const scale=5.8/Math.max(size.x,size.z);obj.scale.setScalar(scale);

}
function clonePen(){const p=penTemplate.clone(true);p.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();if('roughness'in o.material)o.material.roughness=Math.max(.28,o.material.roughness??.5)}}});return p}
function updatePenControl(){const button=document.querySelector('#add');button.disabled=penCount>=MAX_PENS;button.textContent=penCount>=MAX_PENS?'2 pens loaded':'Add pen'}

 if(index>=MAX_PENS)return;

function addPen(){if(!penTemplate||penCount>=MAX_PENS)return;const p=clonePen();placePen(p,penCount);setStatus('Table ready • '+penCount+' pens loaded',true)}
try{
 // The GLB has UVs but no embedded image textures, so load the matching diffuse map separately.

}
document.querySelector('#orbit').addEventListener('click',e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate);e.currentTarget.textContent='Auto rotate: '+(controls.autoRotate?'On':'Off')});

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);
let previousTime=performance.now()/1000;

 if(dt>0&&physicsBodies.length){
  physicsWorld.step(1/60,dt,5);
  for(const item of physicsBodies){
   const {mesh,body}=item;
   mesh.position.set(body.position.x,body.position.y,body.position.z);
   mesh.quaternion.set(body.quaternion.x,body.quaternion.y,body.quaternion.z,body.quaternion.w);
   if(!item.out&&!matchOver&&(Math.abs(body.position.x)>TABLE_HALF_X+.37||Math.abs(body.position.z)>TABLE_HALF_Z+.06||body.position.y<tableTopY-.55)){
    item.out=true;body.wakeUp();matchOver=true;
    const winner=item.index===0?'PEN B WINS':'PEN A WINS';
    setStatus((item.index===0?'PEN A':'PEN B')+' OUT · '+winner,true);
    vectorInfo.textContent='ROUND OVER · Press Reset round to play again';
   }
  }
 }
 if(aimVectorHelper&&now>vectorHideAt&&!activeHit){aimVectorHelper.visible=false;vectorInfo.textContent='HIT VECTOR · drag from a pen to aim';}
 for(let i=hitMarkers.length-1;i>=0;i--){
  const marker=hitMarkers[i],life=now-marker.born,opacity=Math.max(0,1-life/marker.duration);
  marker.dotMaterial.opacity=opacity;marker.ringMaterial.opacity=opacity;
  const scale=1+Math.min(1,life/marker.duration)*.65;marker.marker.scale.setScalar(scale);
  if(life>=marker.duration){
   marker.marker.removeFromParent();marker.dotMaterial.dispose();marker.ringMaterial.dispose();hitMarkers.splice(i,1);
  }
 }
 controls.update();renderer.render(scene,camera);
}
animate();
</script>
