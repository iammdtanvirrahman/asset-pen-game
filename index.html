<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pen Fighter — 3D Asset Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#f4f4f5;font:14px system-ui,sans-serif}
#view{position:fixed;inset:0}header{position:fixed;top:0;left:0;right:0;z-index:2;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#090b10dd,transparent)}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0}small{display:block;color:#a1a1aa;margin-top:4px;letter-spacing:.02em}
.pill{border:1px solid #ffffff25;border-radius:999px;padding:8px 12px;background:#111827aa;color:#d4d4d8}
footer{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;align-items:end;pointer-events:none}
.note{max-width:420px;color:#c4c4cc;background:#090b10b8;border:1px solid #ffffff18;border-radius:12px;padding:12px 14px;line-height:1.5}
.controls{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}button{border:1px solid #ffffff26;border-radius:10px;padding:10px 13px;background:#171a23;color:white;font-weight:600;cursor:pointer}button:hover{background:#292d3a}
@media(max-width:600px){header{padding:14px}.pill{font-size:11px}footer{left:12px;right:12px;bottom:12px;align-items:stretch;flex-direction:column}.note{max-width:none}.controls button{flex:1}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script>
</head>
<body><div id="view"></div>
<header><div><h1>3D Asset Preview</h1><small>Table model loaded from assets</small></div><span class="pill" id="status">Loading model…</span></header>
<footer><div class="note">Drag to orbit · scroll/pinch to zoom.</div><div class="controls"><button id="reset">Reset view</button></div></footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const host=document.querySelector('#view');
const scene=new THREE.Scene();scene.background=new THREE.Color('#0b0d12');
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(7.8,7.1,9.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.2,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xe8efff,0x493021,3.0));
const key=new THREE.DirectionalLight(0xffe3bc,4.2);key.position.set(-4,9,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const fill=new THREE.DirectionalLight(0x9dbbff,2.0);fill.position.set(5,5,-5);scene.add(fill);

const status=document.querySelector('#status');
new GLTFLoader().load('./assets/table/models/gallinera_table_4k.glb',gltf=>{
  const model=gltf.scene;
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  model.scale.setScalar(8.5/maxDim);
  model.position.y=.13;
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  scene.add(model);
  status.textContent='Table loaded · loading texture maps';

  const textureLoader=new THREE.TextureLoader();
  const loadTexture=(url)=>new Promise((resolve,reject)=>{
    textureLoader.load(url,resolve,undefined,reject);
  });
  const textureSettings=(t,colorSpace)=>{
    t.colorSpace=colorSpace;
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);
    t.needsUpdate=true;
    return t;
  };
  const applyMap=(property,texture)=>{
    if(!texture)return;
    model.traverse(o=>{
      if(!o.isMesh)return;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>{
        if(!m)return;
        m[property]=texture;
        if(property==='map')m.color.set('#ffffff');
        m.needsUpdate=true;
      });
    });
  };

  // These files are confirmed in the repository's textures folder.
  loadTexture('./assets/table/textures/gallinera_table_diff_4k.jpg').then(diffuseMap=>{
    applyMap('map',textureSettings(diffuseMap,THREE.SRGBColorSpace));
    status.textContent='Diffuse loaded · loading AO and ARM maps';
    const mapLoadStarted=performance.now();

    const optionalMaps=[
      loadTexture('./assets/table/textures/gallinera_table_ao_4k.jpg').then(t=>({kind:'ao',texture:textureSettings(t,THREE.NoColorSpace)})),
      loadTexture('./assets/table/textures/gallinera_table_arm_4k.jpg').then(t=>({kind:'arm',texture:textureSettings(t,THREE.NoColorSpace)}))
    ];
    Promise.allSettled(optionalMaps).then(results=>{
      let aoLoaded=false,armLoaded=false;
      results.forEach(result=>{
        if(result.status!=='fulfilled')return;
        const {kind,texture}=result.value;
        if(kind==='ao'){
          // AO maps require a second UV attribute in Three.js.
          model.traverse(o=>{
            if(!o.isMesh||!o.geometry?.attributes?.uv)return;
            if(!o.geometry.attributes.uv2)o.geometry.setAttribute('uv2',o.geometry.attributes.uv);
            const mats=Array.isArray(o.material)?o.material:[o.material];
            mats.forEach(m=>{if(m){m.aoMap=texture;m.aoMapIntensity=1;m.needsUpdate=true}});
          });
          aoLoaded=true;
        }
        if(kind==='arm'){
          // Standard ARM packing: R=AO, G=roughness, B=metalness.
          applyMap('roughnessMap',texture);
          applyMap('metalnessMap',texture);
          model.traverse(o=>{
            if(!o.isMesh)return;
            const mats=Array.isArray(o.material)?o.material:[o.material];
            mats.forEach(m=>{if(m){m.roughness=1;m.metalness=1;m.needsUpdate=true}});
          });
          armLoaded=true;
        }
      });
      const loaded=['diffuse',aoLoaded&&'AO',armLoaded&&'ARM (roughness/metalness)'].filter(Boolean);
      status.textContent=loaded.join(' + ')+' loaded';
      console.info('Optional map loading finished in '+Math.round(performance.now()-mapLoadStarted)+' ms');
      if(results.some(r=>r.status==='rejected'))console.warn('One or more optional AO/ARM textures failed to load.');
      console.info('Texture status:',{diffuse:true,ao:aoLoaded,arm:armLoaded,normal:false});
    });
  }).catch(err=>{
    console.error('Diffuse texture loading error:',err);
    status.textContent='Diffuse texture failed · check file path';
  });
},undefined,()=>{
  status.textContent='Asset failed to load';
});
document.querySelector('#reset').onclick=()=>{camera.position.set(7.8,7.1,9.5);controls.target.set(0,.2,0);controls.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
</script></body></html>
