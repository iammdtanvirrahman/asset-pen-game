<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Pen Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--sf:#111114;--ac:#dc3545;--tx:#f5f5f7;--mu:#a1a1aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:16px 'Hind Siliguri',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;pointer-events:none;font-size:13px}
.chip{padding:1px 9px;border-radius:99px;background:#000a;border:1px solid #ffffff1a;white-space:nowrap}
.chip.me{border-color:currentColor;background:#000d}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:13px;text-shadow:0 1px 6px #000;pointer-events:none}
:fullscreen #hint{display:none}
#tools{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:6px}
button{font:inherit;font-weight:600;color:var(--tx);background:var(--sf);border:1px solid #ffffff22;border-radius:8px;padding:9px 15px;cursor:pointer}
#tools button{padding:3px 10px;font-size:13px;background:#000a}
button:hover{border-color:var(--ac)}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on,button.go{background:var(--ac);border-color:var(--ac)}button.go{padding:12px 26px}button:disabled{opacity:.55;cursor:default}
.ov{position:fixed;inset:0;display:flex;align-items:center;padding:24px;overflow:auto;background:linear-gradient(90deg,#080808ee 25%,#08080822)}
.ov[hidden]{display:none}
.card{max-width:390px;display:grid;gap:12px}
h1{font:46px/1 'Permanent Marker',cursive;margin:0}p{margin:0;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row span{color:var(--mu);min-width:74px;font-size:14px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
<div id="view"></div>
<div id="hud"></div><div id="hint"></div>
<div id="tools"><button id="cam">Top view</button><button id="snd">Sound on</button><button id="fs">Fullscreen</button><button id="mn">Menu</button></div>
<div class="ov" id="menu"><div class="card">
<h1>Pen Fighter</h1>
<p>Each player gets several pens. Flick one per turn, smash the other pens, and push them off the table. Last player with a pen on the table wins.</p>
<div class="row" id="np"><span>Players</span><button data-v="2" class="on">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button></div>
<div class="row" id="kp"><span>Pens each</span><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="4">4</button><button data-v="5">5</button></div>
<div class="row" id="md"><span>Mode</span><button data-v="0" class="on">Local</button><button data-v="1">Vs computer</button></div>
<div class="row" id="lv"><span>Computer</span><button data-v="0">Easy</button><button data-v="1" class="on">Medium</button><button data-v="2">Hard</button></div>
<div class="row"><button class="go" id="go" disabled>Loading table…</button><button id="qm" disabled>Quick match</button></div>
<p id="stats"></p><p id="note"></p>
</div></div>
<div class="ov" id="end" hidden><div class="card">
<h1 id="win"></h1>
<div class="row"><button class="go" id="again">Play again</button><button id="back">Change setup</button></div>
</div></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=s=>document.querySelector(s),COL=['#dc3545','#3b82f6','#22c55e','#f59e0b','#a855f7','#06b6d4'];
// pen: radius, half length, spheres along the axis, mass | VMAX flick speed, PULL drag distance, MUG = friction*gravity (AI aim)
const R=.085,HL=.75,NS=13,M=.3,VMAX=21,PULL=2.2,MUG=21,EDGE=.92;
let N=2,K=3,vsAI=0,diff=1,mute=false;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
// stats kept in localStorage: matches, wins vs computer, knock-offs, win streaks
const ST=Object.assign({played:0,won:0,elim:0,streak:0,best:0},(()=>{try{return JSON.parse(localStorage.getItem('pf-stats'))||{}}catch(e){return {}}})());
const save=()=>{try{localStorage.setItem('pf-stats',JSON.stringify(ST))}catch(e){}};
const showStats=()=>{$('#stats').textContent=`Matches ${ST.played} · Wins vs computer ${ST.won} · Knock-offs ${ST.elim} · Best streak ${ST.best}`};showStats();
function endStats(live){ST.played++;if(vsAI){if(live[0]===0){ST.won++;ST.streak++;ST.best=Math.max(ST.best,ST.streak)}else ST.streak=0}save();showStats()}

// ---- scene
const scene=new THREE.Scene();scene.background=new THREE.Color('#0b0d12');
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,6,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;
$('#view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8efff,0x493021,3));
const key=new THREE.DirectionalLight(0xffe3bc,4.2);key.position.set(-4,9,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:30});key.shadow.camera.updateProjectionMatrix();
key.shadow.bias=-.0004;key.shadow.normalBias=.04;scene.add(key);
const fill=new THREE.DirectionalLight(0x9dbbff,2);fill.position.set(5,5,-5);scene.add(fill);

// ---- physics: 1 unit is roughly 14 cm, so gravity is scaled up (pen ~18 cm, table ~1.2 m)
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-60,0)});
world.solver.iterations=14;world.allowSleep=true;
const mT=new CANNON.Material('table'),mP=new CANNON.Material('pen');
world.addContactMaterial(new CANNON.ContactMaterial(mT,mP,{friction:.35,restitution:.18}));
world.addContactMaterial(new CANNON.ContactMaterial(mP,mP,{friction:.3,restitution:.32}));

// ---- sound (tiny synthesized clicks, no files)
let AC,lastT=0;
function tick(v){if(mute)return;const n=performance.now();if(n-lastT<35)return;lastT=n;
try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.value=380+Math.random()*260;
g.gain.setValueAtTime(.12*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g).connect(AC.destination);o.start();o.stop(t+.1)}catch(e){}}

// ---- table: the repo's GLB, with a plain wooden fallback so the game still runs without it
let topY=0,floorY=-4,hx=3.8,hz=2.4,ready=false;
function physTable(){
world.addBody(new CANNON.Body({mass:0,material:mT,shape:new CANNON.Box(new CANNON.Vec3(hx,(topY-floorY)/2,hz)),position:new CANNON.Vec3(0,(topY+floorY)/2,0)}));
const fb=new CANNON.Body({mass:0,material:mT,shape:new CANNON.Plane()});fb.position.set(0,floorY,0);fb.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(fb);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:'#14110f',roughness:1}));
fl.rotation.x=-Math.PI/2;fl.position.y=floorY-.002;fl.receiveShadow=true;scene.add(fl);
ready=true;$('#qm').disabled=false;$('#go').disabled=false;$('#go').textContent='Start game';
}
function fallbackTable(){
topY=0;floorY=-4;hx=4;hz=2.6;
const wood=new THREE.MeshStandardMaterial({color:'#6b4423',roughness:.7}),top=new THREE.Mesh(new THREE.BoxGeometry(8.4,.3,5.4),wood);
top.position.y=-.15;top.castShadow=top.receiveShadow=true;scene.add(top);
for(const [x,z] of [[-3.8,-2.3],[3.8,-2.3],[-3.8,2.3],[3.8,2.3]]){const l=new THREE.Mesh(new THREE.BoxGeometry(.3,3.7,.3),wood);l.position.set(x,-2.15,z);l.castShadow=true;scene.add(l)}
$('#note').textContent='Table model not found, using a simple wooden table. Put the GLB at assets/table/models/gallinera_table_4k.glb.';
physTable();
}
const tl=new THREE.TextureLoader(),TP='./assets/table/textures/gallinera_table_';
const tex=(f,cs)=>tl.loadAsync(TP+f).then(t=>{t.colorSpace=cs;t.flipY=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t});
new GLTFLoader().load('./assets/table/models/gallinera_table_4k.glb',g=>{
const m=g.scene;
m.scale.setScalar(8.5/Math.max(...new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3()).toArray()));
m.updateMatrixWorld(true);
m.position.copy(new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()).negate());
m.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true});
scene.add(m);m.updateMatrixWorld(true);
const b=new THREE.Box3().setFromObject(m);
topY=b.max.y;floorY=b.min.y;hx=(b.max.x-b.min.x)/2*EDGE;hz=(b.max.z-b.min.z)/2*EDGE;
physTable();
Promise.allSettled([tex('diff_4k.jpg',THREE.SRGBColorSpace),tex('nor_gl_4k.jpg',THREE.NoColorSpace),tex('arm_4k.jpg',THREE.NoColorSpace)]).then(([d,n,a])=>{
if(a.value)a.value.channel=0;
m.traverse(o=>{if(!o.isMesh)return;(Array.isArray(o.material)?o.material:[o.material]).forEach(x=>{if(!x)return;
if(d.value){x.map=d.value;x.color.set('#ffffff')}
if(n.value){x.normalMap=n.value;x.normalScale.set(.55,.55)}
if(a.value){x.aoMap=a.value;x.aoMapIntensity=.35;x.roughnessMap=a.value;x.roughness=1;x.metalnessMap=a.value;x.metalness=.15}
x.needsUpdate=true})});
});
},undefined,err=>{console.warn('Table GLB failed to load:',err);fallbackTable()});

// ---- pens: a chain of spheres along the axis gives a rounded rigid pen that can slide, roll, spin, tilt and hop
function mkPen(pi,x,z,yaw){
const c=COL[pi],body=new THREE.MeshStandardMaterial({color:c,roughness:.3,metalness:.15,emissive:c,emissiveIntensity:0}),
chrome=new THREE.MeshStandardMaterial({color:'#c8ccd2',roughness:.22,metalness:.85}),dark=new THREE.MeshStandardMaterial({color:'#202126',roughness:.3,metalness:.25}),g=new THREE.Group();
const cyl=(r,l,m,x)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,24),m);o.rotation.z=Math.PI/2;o.position.x=x;g.add(o)};
cyl(R,.9,body,-.1);cyl(R*1.1,.2,dark,-.65);cyl(R*1.04,.25,dark,.475);cyl(R*1.12,.03,chrome,-.55);cyl(R*1.12,.03,chrome,.35);
const tip=new THREE.Mesh(new THREE.ConeGeometry(R*.9,.13,24),chrome);tip.rotation.z=-Math.PI/2;tip.position.x=.665;g.add(tip);
const nib=new THREE.Mesh(new THREE.ConeGeometry(R*.25,.07,12),dark);nib.rotation.z=-Math.PI/2;nib.position.x=.76;g.add(nib);
const clip=new THREE.Mesh(new THREE.BoxGeometry(.38,.02,.045),chrome);clip.position.set(-.3,R+.012,0);g.add(clip);
g.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true});scene.add(g);
const b=new CANNON.Body({mass:M,material:mP,position:new CANNON.Vec3(x,topY+R+.002,z),linearDamping:.12,angularDamping:.5,allowSleep:true,sleepSpeedLimit:.15,sleepTimeLimit:.8});
for(let i=0;i<NS;i++)b.addShape(new CANNON.Sphere(R),new CANNON.Vec3(-(HL-.1)+i*2*(HL-.1)/(NS-1),0,0));
b.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),yaw);
b.userData={pl:pi};b.addEventListener('collide',e=>{const u=e.body.userData;if(u&&u.pl!==pi)b.lastHit=u.pl;const v=Math.abs(e.contact.getImpactVelocityAlongNormal());if(v>1.2)tick(Math.min(1,v/12))});
world.addBody(b);return {mesh:g,body:b,mat:body};
}
const axisOf=p=>{const a=new CANNON.Vec3(1,0,0);p.body.quaternion.vmult(a,a);return a};

// ---- game state
const pens=[];let cur=0,phase='menu',t0=0,calm=0,T=0,topView=false,sel=null,aim=null,dragging=false;
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,0xffffff,.35,.25);arrow.visible=false;scene.add(arrow);
const th=i=>Math.PI/2+i*2*Math.PI/N,pl=i=>pens.filter(p=>p.alive&&p.pl===i);
const name=i=>vsAI&&i?'Computer'+(N>2?' '+i:''):'Player '+(i+1);
const kill=p=>{if(p.gone)return;p.gone=true;scene.remove(p.mesh);world.removeBody(p.body)};
function hud(){$('#hud').innerHTML=Array.from({length:N},(_,i)=>`<span class="chip${i===cur&&phase!=='over'?' me':''}" style="color:${COL[i]}">${vsAI&&i?'CPU'+(N>2?i:''):'P'+(i+1)} · ${pl(i).length}</span>`).join('')}
function start(){
pens.forEach(kill);pens.length=0;
const A=Math.max(.8,hx-1.25),B=Math.max(.6,hz-1.15),Ke=N>4?Math.min(K,3):K;
for(let i=0;i<N;i++){
const a=th(i),x0=Math.cos(a)*A,z0=Math.sin(a)*B,tx=-Math.sin(a)*A,tz=Math.cos(a)*B,tn=Math.hypot(tx,tz)||1,yaw=Math.atan2(z0,-x0);
for(let k=0;k<Ke;k++){const o=(k-(Ke-1)/2)*.62;pens.push({pl:i,alive:true,...mkPen(i,x0+tx/tn*o,z0+tz/tn*o,yaw)})}
}
cur=0;$('#menu').hidden=$('#end').hidden=true;next();
}
function next(){
phase='aim';sel=null;pens.forEach(p=>p.body.lastHit=null);hud();const ai=vsAI&&cur>0;
$('#hint').textContent=ai?`${name(cur)} is thinking…`:`${name(cur)}: drag back from one of your glowing pens, then let go to flick`;
if(ai)setTimeout(aiShoot,[1400,1000,700][diff]);
}
function shoot(p,dir,f,s){
const b=p.body,ax=axisOf(p),v=VMAX*f;
// hitting off-centre along the pen spins it; a small upward part makes hard flicks hop and tilt
s=Math.max(-.6,Math.min(.6,s));
b.wakeUp();b.applyImpulse(new CANNON.Vec3(dir.x*v*M,(.05+.22*f*f)*v*M,dir.z*v*M),ax.scale(s));
phase='moving';t0=calm=0;sel=null;arrow.visible=false;$('#hint').textContent='';tick(.6);hud();
}
function aiShoot(){
if(phase!=='aim')return;let best=null;
for(const me of pl(cur))for(const e of pens)if(e.alive&&e.pl!==cur){
const a=me.body.position,b=e.body.position,d=Math.hypot(b.x-a.x,b.z-a.z),sc=(diff?d:Math.random()*8)+Math.min(hx-Math.abs(b.x),hz-Math.abs(b.z))*[0,1.2,2.2][diff];
if(!best||sc<best.sc)best={me,e,d,sc}}
if(!best)return;
const a=best.me.body.position,b=best.e.body.position,ang=Math.atan2(b.z-a.z,b.x-a.x)+(Math.random()-.5)*[.5,.22,.07][diff];
shoot(best.me,{x:Math.cos(ang),z:Math.sin(ang)},Math.min(1,(Math.sqrt(2*MUG*best.d)*[1.15,1.3,1.45][diff]+(Math.random()-.5)*[6,3,.8][diff])/VMAX),(Math.random()-.5)*.8);
}
function settle(){
const live=[...new Set(pens.filter(p=>p.alive).map(p=>p.pl))];
if(live.length<2){phase='over';endStats(live);hud();$('#hint').textContent='';
$('#win').textContent=live.length?name(live[0])+' wins':'Draw';$('#win').style.color=live.length?COL[live[0]]:'';$('#end').hidden=false;return}
do{cur=(cur+1)%N}while(!live.includes(cur));next();
}

// ---- input: grab a pen anywhere along its length, pull back, release
const cv=renderer.domElement,PL=new THREE.Plane(new THREE.Vector3(0,1,0),0),ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const at=e=>{ndc.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ndc,camera);PL.constant=-(topY+R);return ray.ray.intersectPlane(PL,new THREE.Vector3())};
cv.addEventListener('pointerdown',e=>{
if(phase!=='aim'||(vsAI&&cur>0))return;const q=at(e);if(!q)return;let best=null,bd=.6,bs=0;
for(const p of pl(cur)){const b=p.body.position,ax=axisOf(p),t=Math.max(-HL,Math.min(HL,(q.x-b.x)*ax.x+(q.z-b.z)*ax.z)),d=Math.hypot(q.x-b.x-ax.x*t,q.z-b.z-ax.z*t);if(d<bd){bd=d;best=p;bs=t}}
if(best){sel=best;sel.s=bs;dragging=true;aim=null;cv.setPointerCapture(e.pointerId)}
});
cv.addEventListener('pointermove',e=>{
if(!dragging||!sel)return;const p=at(e),b=sel.body.position;if(!p)return;
const v=new THREE.Vector3(b.x-p.x,0,b.z-p.z),len=v.length();if(len<1e-3)return;
const L=Math.min(len,PULL);aim={dir:v.normalize(),L};
arrow.position.set(b.x,topY+.16,b.z);arrow.setDirection(aim.dir);arrow.setLength(Math.max(.3,L*1.2),.35,.25);arrow.setColor(L>PULL*.8?0xdc3545:0xffffff);arrow.visible=true;
});
const release=()=>{if(!dragging)return;dragging=false;
if(aim&&aim.L>.25&&sel)shoot(sel,aim.dir,aim.L/PULL,sel.s);else{arrow.visible=false;sel=null}aim=null};
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

// ---- menu and tools
const pick=(g,f)=>document.querySelectorAll(g+' button').forEach(b=>b.onclick=()=>{f(+b.dataset.v);document.querySelectorAll(g+' button').forEach(x=>x.classList.toggle('on',x===b))});
pick('#np',v=>N=v);pick('#kp',v=>K=v);pick('#md',v=>vsAI=v);pick('#lv',v=>diff=v);
$('#qm').onclick=()=>{N=2;K=3;vsAI=1;diff=1;start()};
$('#go').onclick=$('#again').onclick=start;
const toMenu=()=>{$('#end').hidden=true;$('#menu').hidden=false;phase='menu';arrow.visible=false;dragging=false;showStats();$('#hint').textContent=''};
$('#back').onclick=$('#mn').onclick=toMenu;
$('#cam').onclick=()=>{topView=!topView;$('#cam').textContent=topView?'Player view':'Top view'};
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'Sound off':'Sound on'};
$('#fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}}catch(e){}};

// ---- camera: sits behind the active player's side while aiming, pulls back while pens fly
const look=new THREE.Vector3(),tp=new THREE.Vector3(),tg=new THREE.Vector3(),clock=new THREE.Clock();
function moveCamera(dt){
const asp=innerWidth/innerHeight,w=Math.max(1,1.5/asp),a=th(phase==='menu'?0:cur);
if(topView){tp.set(0,topY+11*w,.7);tg.set(0,topY,0)}
else{const D=7.4*w;tp.set(Math.cos(a)*D,topY+(phase==='moving'?6.6:5.2)*w,Math.sin(a)*D);tg.set(0,topY,0)}
const k=RM?1:1-Math.pow(.002,dt);camera.position.lerp(tp,k);look.lerp(tg,k);camera.lookAt(look);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

(function frame(){
requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);T+=dt;
if(ready){
world.step(1/120,dt,6);
for(const p of pens){if(p.gone)continue;
p.mesh.position.copy(p.body.position);p.mesh.quaternion.copy(p.body.quaternion);
if(p.alive&&p.body.position.y<topY-.5){p.alive=false;p.t=T;const h=p.body.lastHit;if(h!=null){$('#hint').textContent=`${name(h)} knocked off a ${name(p.pl)} pen`;if(!(vsAI&&h>0)){ST.elim++;save()}}else $('#hint').textContent=`${name(p.pl)} lost a pen`;hud();tick(1)}
if(!p.alive&&T-p.t>1.6)kill(p);
// a soft pulse marks the current player's pens; the grabbed one burns brighter
p.mat.emissiveIntensity=phase==='aim'&&p.alive&&p.pl===cur?.25+(RM?0:.2*Math.sin(T*5))+(p===sel?.4:0):0;
}
if(phase==='moving'){
t0+=dt;
const still=pens.every(p=>!p.alive||(p.body.velocity.length()<.2&&p.body.angularVelocity.length()<.6));
calm=still?calm+dt:0;
if((t0>.5&&calm>.8)||t0>14)settle();
}
}
moveCamera(dt);renderer.render(scene,camera);
})();
</script>
</body></html>
